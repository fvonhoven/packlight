# Diagnostic: proves Expo Workflows can start a job and check out this repo,
# and shows which Expo permissions the run has. Starts no builds.
name: Smoke test
on:
  workflow_dispatch: {}
jobs:
  smoke:
    name: Checkout and EAS CLI identity
    type: custom
    steps:
      - uses: eas/checkout
      - run: npx --yes eas-cli@latest whoami
